services:
  - type: web
    name: movierec-fastapi-2026
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: movierec-accounts
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FRONTEND_URL
        value: https://movierec-web-2026.onrender.com
      - key: AUTH_DB
        value: /var/data/accounts.db

  - type: static
    name: movierec-web-2026
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://movierec-fastapi-2026.onrender.com