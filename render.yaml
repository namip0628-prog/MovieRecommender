services:
  - type: web
    name: movie-recommender-fastapi
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://movie-recommender-web.onrender.com

  - type: static
    name: movie-recommender-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://movie-recommender-fastapi.onrender.com